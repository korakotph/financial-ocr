# fly.toml app configuration file generated for financial-ocr on 2026-06-26T17:28:36Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'financial-ocr'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[mounts]]
  source = "financial_ocr_data"
  destination = "/data"
